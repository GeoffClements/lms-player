name: Test Vibe Feature Builds

on:
  push:
    branches:
      - master

jobs:
  vibe:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Default feature set
          - name: default
            no_default: ""
            features: ""

          # Single backends (default features)
          - name: pulse
            no_default: ""
            features: "pulse"
          - name: pipewire
            no_default: ""
            features: "pipewire"
          - name: rodio
            no_default: ""
            features: "rodio"

          # Backend combinations (default features)
          - name: pulse+pipewire
            no_default: ""
            features: "pulse,pipewire"
          - name: pulse+rodio
            no_default: ""
            features: "pulse,rodio"
          - name: pipewire+rodio
            no_default: ""
            features: "pipewire,rodio"
          - name: pulse+pipewire+rodio
            no_default: ""
            features: "pulse,pipewire,rodio"

          # Notify only (default features)
          - name: notify
            no_default: ""
            features: "notify"

          # no-default-features + exactly one backend
          - name: nd-pulse
            no_default: "--no-default-features"
            features: "pulse"
          - name: nd-pipewire
            no_default: "--no-default-features"
            features: "pipewire"
          - name: nd-rodio
            no_default: "--no-default-features"
            features: "rodio"

          # no-default-features + notify + one backend
          - name: nd-pulse+notify
            no_default: "--no-default-features"
            features: "pulse,notify"
          - name: nd-pipewire+notify
            no_default: "--no-default-features"
            features: "pipewire,notify"
          - name: nd-rodio+notify
            no_default: "--no-default-features"
            features: "rodio,notify"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Filter changes
        uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            vibe:
              - 'vibe/**'
              - 'lms-proto/**'

      - if: steps.changes.outputs.vibe == 'true'
        name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: x86_64-unknown-linux-gnu
          cache: true

      - if: steps.changes.outputs.vibe == 'true'
        name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libpulse-dev \
            libasound2-dev \
            libdbus-1-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libclang-dev

      - if: steps.changes.outputs.vibe == 'true'
        name: Build
        run: |
          if [ -n "${{ matrix.features }}" ]; then
            cargo build --package Vibe_Player ${{ matrix.no_default }} --features "${{ matrix.features }}"
          else
            cargo build --package Vibe_Player ${{ matrix.no_default }}
          fi

  lms-proto:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Filter changes
        uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            lms-proto:
              - 'lms-proto/**'

      - if: steps.changes.outputs.lms-proto == 'true'
        name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: x86_64-unknown-linux-gnu
          cache: true

      - if: steps.changes.outputs.lms-proto == 'true'
        name: Build
        run: cargo build --package lms-proto

      - if: steps.changes.outputs.lms-proto == 'true'
        name: Test
        run: cargo test --package lms-proto
